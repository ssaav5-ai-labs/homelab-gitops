apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: hermes-managed
    files:
      - managed/config.yaml
      - managed/.env
  - name: hermes-soul
    files:
      - SOUL.md
  - name: hermes-scripts
    files:
      - scripts/grafana-alerts.py
  - name: hermes-sync-hook
    files:
      - scripts/copy-skills.sh
