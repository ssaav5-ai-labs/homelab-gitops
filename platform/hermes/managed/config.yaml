model:
  provider: lab-gateway
  default: code
  base_url: http://litellm.llm-gateway.svc:4000/v1
providers:
  lab-gateway:
    api: http://litellm.llm-gateway.svc:4000/v1
    api_key: "${LAB_GATEWAY_KEY}"
    session_affinity_header: x-litellm-session-id
    discover_models: false
    models: [fast, code]
auxiliary:
  compression: {provider: lab-gateway, model: fast}
  title_generation: {provider: lab-gateway, model: fast}
  approval: {provider: lab-gateway, model: fast}
agent:
  disabled_toolsets: [browser, computer_use, image_gen, video_gen, tts, connections, x_search]
terminal:
  backend: local
  cwd: /opt/data/work
  timeout: 120
approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  deny:
    - kubectl delete*
    - kubectl apply*
    - kubectl edit*
    - kubectl patch*
    - kubectl scale*
    - kubectl drain*
    - kubectl cordon*
    - git push*
    - "*curl*|*sh*"
    - "*wget*|*sh*"
command_allowlist: []
skills:
  # external_dirs is NOT managed — v0.22.7 ignores it in managed scope.
  # It is set in /opt/data/config.yaml by the seed init container at every start
  # so Git wins on restart.
  write_approval: true
  guard_agent_created: true
slack:
  # Unauthorized DMs are silently ignored (rather than the default "pair" prompt),
  # since only the operator's user ID is allowed in SLACK_ALLOWED_USERS.
  unauthorized_dm_behavior: ignore
security:
  redact_secrets: true
  allow_private_urls: false