cluster:
  name: homelab

global:
  scrapeInterval: 60s

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-68-prod-eu-west-6.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: metrics-username
      passwordKey: token
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring

  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-043.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: logs-username
      passwordKey: token
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring

clusterMetrics:
  enabled: true
  collector: alloy-metrics

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      useDefaultAllowList: true
      includeMetrics:
        - node_vmstat_pswpin

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics

collectors:
  alloy-metrics:
    presets: [small, clustered, statefulset]
    replicas: 1
    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 416Mi
        limits:
          memory: 832Mi
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 144Mi

  alloy-logs:
    presets: [filesystem-log-reader, daemonset]
    alloy:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 208Mi
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 144Mi

  alloy-singleton:
    presets: [deployment]
    replicas: 1
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: homelab.io/size
                  operator: In
                  values:
                    - large
    alloy:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 208Mi
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 144Mi

alloy-operator:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

telemetryServices:
  kube-state-metrics:
    deploy: true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: homelab.io/size
                  operator: In
                  values:
                    - large
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 176Mi

  node-exporter:
    deploy: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 160Mi