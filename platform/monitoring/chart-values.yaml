cluster:
  name: homelab

global:
  scrapeInterval: 60s

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-68-prod-eu-west-6.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: metrics-username
      passwordKey: token
    rules:
      enabled: true
      address: https://prometheus-prod-68-prod-eu-west-6.grafana.net
      collector: alloy-singleton
      syncInterval: 5m
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring

  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-043.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: logs-username
      passwordKey: token
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring

clusterMetrics:
  enabled: true
  collector: alloy-metrics

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics

collectors:
  alloy-metrics:
    presets: [small, clustered, statefulset]
    replicas: 1
    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 160Mi
        limits:
          memory: 512Mi

  alloy-logs:
    presets: [filesystem-log-reader, daemonset]
    alloy:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

  alloy-singleton:
    presets: [deployment]
    replicas: 1
    alloy:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

alloy-operator:
  alloy:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

telemetryServices:
  kube-state-metrics:
    deploy: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  node-exporter:
    deploy: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi