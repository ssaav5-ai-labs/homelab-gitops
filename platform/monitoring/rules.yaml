apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab
  namespace: monitoring
spec:
  groups:
    - name: lab
      rules:
        - alert: LabSilent
          expr: absent_over_time(up{cluster="homelab"}[10m])
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "no metrics from the homelab for 15 minutes: both nodes, the network or Alloy are down"
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "an Argo CD app has been out of sync for 30 minutes: Git no longer describes the cluster"
        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "an Argo CD app has been unhealthy for 15 minutes"
        - alert: NodeSwapping
          expr: rate(node_vmstat_pswpin[10m]) > 100
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "steady swapping means this node needs less load or more RAM"
        - alert: NodeDiskFilling
          expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "the root filesystem on a node is less than 15% free"
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true", cluster="homelab"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "a k3s node has been NotReady for 5 minutes"
        - alert: PodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{cluster="homelab", reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "a container is in CrashLoopBackOff"
        - alert: LiteLLMDown
          expr: up{cluster="homelab", namespace="llm-gateway"} == 0 or absent(up{cluster="homelab", namespace="llm-gateway"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "the LiteLLM gateway is down or not being scraped for 5 minutes"
        - alert: HermesDown
          expr: kube_deployment_status_replicas_available{cluster="homelab", namespace="hermes", deployment="hermes"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "chat and alert diagnosis are off; plain Slack alerts still work"
        - alert: HermesBudgetLow
          expr: litellm_remaining_api_key_budget_metric{cluster="homelab", api_key_alias="hermes"} < 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "the Hermes gateway key has less than 1 USD of budget remaining"
        - alert: PostgresDown
          expr: kube_statefulset_status_replicas_ready{namespace="llm-gateway", statefulset="postgres"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "the gateway's Postgres database is down: every virtual key fails without it"
        - alert: SreCrewsDown
          expr: kube_deployment_status_replicas_available{cluster="homelab", namespace="sre", deployment="sre-crews"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "the SRE crews are at zero replicas: alert investigation is without the crew until they restart"
        - alert: CrewsBudgetLow
          expr: litellm_remaining_api_key_budget_metric{cluster="homelab", api_key_alias="crews"} < 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "the crews gateway key has less than 1 USD of budget remaining"
