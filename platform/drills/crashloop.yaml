apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      containers:
        - name: busybox
          image: busybox:1.36.1
          command: ["sh", "-c", "exit 1"]
