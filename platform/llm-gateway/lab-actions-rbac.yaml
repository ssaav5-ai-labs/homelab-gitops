apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-actions
  namespace: llm-gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-actions
  namespace: llm-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-actions
subjects:
  - kind: ServiceAccount
    name: lab-actions
    namespace: sre
