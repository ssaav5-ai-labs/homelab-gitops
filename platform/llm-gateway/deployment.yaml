apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: homelab.io/size
                    operator: In
                    values:
                      - large
      containers:
        - name: litellm
          image: litellm/litellm:v1.106.6
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "1"
          envFrom:
            - secretRef:
                name: llm-gateway
          env:
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_USERNAME
              value: litellm
            - name: DATABASE_NAME
              value: litellm
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-gateway
                  key: POSTGRES_PASSWORD
            - name: LANGFUSE_OTEL_HOST
              value: https://cloud.langfuse.com
          ports:
            - containerPort: 4000
              name: http
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 1104Mi
            limits:
              memory: 2304Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config