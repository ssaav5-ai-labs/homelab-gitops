apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: litellm/litellm:v1.106.6
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "1"
          envFrom:
            - secretRef:
                name: llm-gateway
          env:
            - name: LANGFUSE_OTEL_HOST
              value: https://cloud.langfuse.com
          ports:
            - containerPort: 4000
              name: http
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 704Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config