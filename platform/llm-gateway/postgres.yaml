apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm-gateway
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-gateway
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18.1-alpine@sha256:d326bec58d3de8d239df60475941522342723934a2598ae59a0281f077681462
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-gateway
                  key: POSTGRES_PASSWORD
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=20
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - pg_isready
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 80Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: local-path