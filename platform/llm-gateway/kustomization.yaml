apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-gateway
resources:
  - namespace.yaml
  - service.yaml
  - ingress.yaml
  - deployment.yaml
  - postgres.yaml
  - servicemonitor.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml