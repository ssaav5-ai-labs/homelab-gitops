apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: career
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: job-search-known-hosts
    files:
      - known_hosts