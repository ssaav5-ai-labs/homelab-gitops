apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyproxy-config
  namespace: career
data:
  tinyproxy.conf: |
    Port 3128
    Filter /etc/tinyproxy/filter.conf
    FilterDefaultDeny Yes
    FilterExtended On
    ConnectPort 443
  filter.conf: |
    ^boards-api\.greenhouse\.io$
    ^api\.lever\.co$
    ^api\.ashbyhq\.com$