apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: career
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tinyproxy
          image: dannydirect/tinyproxy:latest@sha256:0c1e9c56952955f799dabddabbd697661ab44172d334f4d27242fde4d33e8bfd
          ports:
            - containerPort: 3128
              name: proxy
          volumeMounts:
            - name: config
              mountPath: /etc/tinyproxy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: tinyproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: career
spec:
  selector:
    app: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128