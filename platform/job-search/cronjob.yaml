apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-triage
  namespace: career
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Dublin
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: job-triage
        spec:
          serviceAccountName: job-search
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: git-sync
              image: registry.k8s.io/git-sync/git-sync:v4.8.0
              args:
                - --repo=git@github.com:ssaav5/career-vault.git
                - --ref=main
                - --root=/vault
                - --link=current
                - --one-time
                - --ssh
                - --ssh-key-file=/etc/vault-keys/id_ro
                - --ssh-known-hosts-file=/etc/ssh/known_hosts
              volumeMounts:
                - name: vault
                  mountPath: /vault
                - name: vault-ro-key
                  mountPath: /etc/vault-keys/id_ro
                  subPath: id_ro
                  readOnly: true
                - name: known-hosts
                  mountPath: /etc/ssh/known_hosts
                  subPath: known_hosts
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 48Mi
                limits:
                  memory: 160Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: triage
              image: ghcr.io/ssaav5-ai-labs/job-search:sha-8026acf@sha256:95588f98afe8a6d551b8e6c8b4a586a092d84b75e03d4fc81c9c3b25b35cb812
              command: ["python", "-m", "job_search.triage"]
              env:
                - name: LAB_GATEWAY_URL
                  value: http://litellm.llm-gateway.svc.cluster.local:4000
                - name: VAULT_READ_ROOT
                  value: /vault/current
                - name: VAULT_WORK_ROOT
                  value: /vault-work
                - name: VAULT_WRITE_KEY
                  value: /etc/vault-keys/rw
                - name: JOB_TRIAGE_ENABLED
                  value: "true"
                - name: IMAP_PROXY
                  value: http://egress-proxy.career.svc.cluster.local:3128
                - name: JOBS_GATEWAY_KEY
                  valueFrom:
                    secretKeyRef:
                      name: job-search
                      key: JOBS_GATEWAY_KEY
                - name: IMAP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: job-triage
                      key: IMAP_HOST
                - name: IMAP_USER
                  valueFrom:
                    secretKeyRef:
                      name: job-triage
                      key: IMAP_USER
                - name: IMAP_APP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: job-triage
                      key: IMAP_APP_PASSWORD
              volumeMounts:
                - name: vault
                  mountPath: /vault
                  readOnly: true
                - name: vault-work
                  mountPath: /vault-work
                - name: vault-rw-key
                  mountPath: /etc/vault-keys/rw
                  subPath: rw
                  readOnly: true
                - name: known-hosts
                  mountPath: /etc/ssh/known_hosts
                  subPath: known_hosts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1024Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 10001
          restartPolicy: OnFailure
          volumes:
            - name: vault
              emptyDir: {}
            - name: vault-work
              emptyDir: {}
            - name: vault-ro-key
              secret:
                secretName: job-search
                items:
                  - key: VAULT_RO_KEY
                    path: id_ro
                defaultMode: 0600
            - name: vault-rw-key
              secret:
                secretName: job-search
                items:
                  - key: VAULT_RW_KEY
                    path: rw
                defaultMode: 0600
            - name: known-hosts
              configMap:
                name: job-search-known-hosts