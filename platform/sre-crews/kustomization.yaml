apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - lab-actions-rbac.yaml
  - lab-actions-deployment.yaml
  - lab-actions-service.yaml
generators:
  - secret-generator.yaml
  - lab-actions-secret-generator.yaml
configMapGenerator:
  - name: k8s-mcp
    files:
      - k8s-mcp.toml
