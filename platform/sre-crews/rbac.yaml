apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-crews
  namespace: sre
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-crews-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-reader
subjects:
  - kind: ServiceAccount
    name: sre-crews
    namespace: sre
