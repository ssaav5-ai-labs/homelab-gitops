name: alert-rules

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        run: |
          YQ_VERSION=v4.54.1
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /tmp/yq" | sha256sum -c -
          chmod +x /tmp/yq

      - name: Install mimirtool
        run: |
          MIMIR_VERSION=3.2.4
          BASE="https://github.com/grafana/mimir/releases/download/mimir-${MIMIR_VERSION}"
          curl -fsSL "${BASE}/mimirtool-linux-amd64" -o /tmp/mimirtool
          EXPECTED=$(curl -fsSL "${BASE}/mimirtool-linux-amd64-sha-256")
          echo "${EXPECTED}  /tmp/mimirtool" | sha256sum -c -
          chmod +x /tmp/mimirtool
          /tmp/mimirtool rules sync --help 2>&1 | grep -q -- '--extra-headers'

      - name: Extract PrometheusRule specs
        run: |
          mkdir -p /tmp/rules
          found=0
          {
            printf 'namespace: homelab\n'
            printf 'groups:\n'
            while IFS= read -r f; do
              count=$(/tmp/yq eval-all 'select(.kind == "PrometheusRule") | .metadata.name' "$f" | wc -l)
              if [ "$count" -eq 0 ]; then
                continue
              fi
              /tmp/yq eval-all '[select(.kind == "PrometheusRule") | .spec.groups[]]' "$f"
              found=$((found+1))
            done < <(grep -rl --include='*.yaml' --include='*.yml' --exclude-dir=.git -E '^kind:[[:space:]]*PrometheusRule[[:space:]]*$' . | sort)
          } > /tmp/rules/homelab.yaml
          if [ "$found" -eq 0 ]; then
            echo "No PrometheusRule documents found in the repo" >&2
            exit 1
          fi
          ls -l /tmp/rules

      - name: Lint and check (pull request)
        if: github.event_name == 'pull_request'
        run: |
          /tmp/mimirtool rules lint /tmp/rules/*.yaml
          /tmp/mimirtool rules check /tmp/rules/*.yaml

      - name: Sync to Grafana Cloud (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MIMIR_ADDRESS: https://yellowhickory60.grafana.net/api/convert/
          MIMIR_TENANT_ID: "1"
          MIMIR_AUTH_TOKEN: ${{ secrets.GRAFANA_RULES_TOKEN }}
        run: |
          /tmp/mimirtool rules sync /tmp/rules/*.yaml \
            --concurrency 1 \
            --namespaces=homelab \
            --extra-headers "X-Grafana-Alerting-Datasource-UID=grafanacloud-prom"