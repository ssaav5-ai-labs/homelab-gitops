name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          ./gitleaks detect -v

      - name: shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar xJ
          find bootstrap/ scripts/ -name '*.sh' -exec ./shellcheck-v0.11.0/shellcheck -x {} +

      - name: check-secrets
        run: scripts/check-secrets.sh

      - name: check-versions
        run: scripts/check-versions.sh

      - name: check-app-finalizers
        run: scripts/check-app-finalizers.sh

      - name: test-grafana-alerts
        run: scripts/test-grafana-alerts.sh

      - name: yaml-parse
        run: |
          pip install -q pyyaml
          python3 -c "
          import sys, yaml, glob
          fail = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if '.github/' in f:
                  continue
              try:
                  with open(f) as fh:
                      for doc in yaml.safe_load_all(fh):
                          pass
              except Exception as e:
                  print(f'FAIL: {f}: {e}', file=sys.stderr)
                  fail = 1
          sys.exit(fail)
          "

      - name: helm-template + kubeconform
        run: |
          ARGOCD_VERSION=$(grep ARGOCD_CHART_VERSION bootstrap/versions.env | cut -d= -f2)
          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm template argocd argo/argo-cd --version "$ARGOCD_VERSION" -n argocd -f bootstrap/argocd/values.yaml > /tmp/argocd.yaml
          K8S_MON_VERSION=$(grep K8S_MONITORING_CHART_VERSION bootstrap/versions.env | cut -d= -f2)
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm template monitoring grafana/k8s-monitoring --version "$K8S_MON_VERSION" -n monitoring -f platform/monitoring/chart-values.yaml > /tmp/monitoring.yaml
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/argocd.yaml /tmp/monitoring.yaml

      - name: kustomize-build + kubeconform
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          touch /tmp/ksops-bin && chmod +x /tmp/ksops-bin
          cat > /tmp/ksops-bin << 'DONE'
          #!/bin/sh
          cat /dev/stdin
          DONE
          export PATH="/tmp:$PATH"
          ./kustomize build --enable-alpha-plugins platform/hermes > /tmp/hermes.yaml
          ./kustomize build --enable-alpha-plugins platform/sre-crews > /tmp/sre-crews.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/hermes.yaml /tmp/sre-crews.yaml