name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          ./gitleaks detect -v

      - name: shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar xJ
          find bootstrap/ scripts/ -name '*.sh' -exec ./shellcheck-v0.11.0/shellcheck -x {} +

      - name: check-secrets
        run: scripts/check-secrets.sh

      - name: check-versions
        run: scripts/check-versions.sh

      - name: yaml-parse
        run: |
          pip install -q pyyaml
          python3 -c "
          import sys, yaml, glob
          fail = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if '.github/' in f:
                  continue
              try:
                  with open(f) as fh:
                      for doc in yaml.safe_load_all(fh):
                          pass
              except Exception as e:
                  print(f'FAIL: {f}: {e}', file=sys.stderr)
                  fail = 1
          sys.exit(fail)
          "

      - name: helm-template + kubeconform (k8s-monitoring)
        run: |
          K8S_MON_VERSION=$(grep K8S_MONITORING_CHART_VERSION bootstrap/versions.env | cut -d= -f2)
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm template monitoring grafana/k8s-monitoring --version "$K8S_MON_VERSION" -n monitoring -f platform/monitoring/chart-values.yaml > /tmp/monitoring.yaml
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/argocd.yaml /tmp/monitoring.yaml