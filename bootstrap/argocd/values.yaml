global:
  domain: argocd.192.168.86.210.nip.io

configs:
  cm:
    timeout.reconciliation: 180s
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

controller:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: homelab.io/size
                operator: In
                values:
                  - large
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'argocd_app_info|argocd_app_sync_total|argocd_app_k8s_request_total|argocd_cluster_info|up'
          action: keep
  resources:
    requests:
      cpu: 100m
      memory: 704Mi
    limits:
      memory: 1280Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      memory: 144Mi

repoServer:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: homelab.io/size
                operator: In
                values:
                  - large
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /home/argocd/.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /home/argocd/.config/sops/age
      name: sops-age
      readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 512Mi
