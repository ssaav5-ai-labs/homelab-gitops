apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drills
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
    targetRevision: main
    path: platform/drills
  destination:
    server: https://kubernetes.default.svc
    namespace: drill
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
