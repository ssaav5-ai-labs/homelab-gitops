apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-canary
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
    targetRevision: main
    path: platform/sops-canary
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-canary
  syncPolicy:
    automated:
      prune: true
      selfHeal: true