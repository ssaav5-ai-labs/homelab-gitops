apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: k8s-monitoring
      targetRevision: 4.6.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/chart-values.yaml
    - repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
      targetRevision: main
      path: platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true