apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-access
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
    targetRevision: main
    path: platform/agent-access
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
