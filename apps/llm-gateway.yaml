apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-gateway
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
      targetRevision: main
      path: platform/llm-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true