apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
spec:
  project: agents
  source:
    repoURL: https://github.com/ssaav5-ai-labs/homelab-gitops.git
    targetRevision: main
    path: platform/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true